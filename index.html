<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little One's Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E7;
    --mint: #DCEEE0;
    --mint-deep: #AEDABB;
    --peach: #F7D9C4;
    --peach-deep: #EFBE97;
    --teal: #2F5D50;
    --teal-soft: #4C7A6C;
    --yellow: #F6C453;
    --brown: #4A3F35;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; min-height: 100%; }

  body{
    font-family: 'Inter', sans-serif;
    color: var(--brown);
    background-color: var(--cream);
    background-image:
      radial-gradient(var(--mint-deep) 1.4px, transparent 1.4px),
      radial-gradient(var(--peach) 1.4px, transparent 1.4px);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px 56px;
  }

  .win {
    width: 100%;
    max-width: 460px;
  }

  /* --- title bar --- */
  .title-bar{
    background: linear-gradient(100deg, var(--peach) 0%, var(--mint) 100%);
    border: 2px solid var(--teal);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .title-bar svg{ width: 18px; height: 18px; flex-shrink: 0; }

  .title-bar-text{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--teal);
  }

  .title-bar-dots{
    margin-left: auto;
    display: flex;
    gap: 5px;
  }
  .title-bar-dots span{
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(47,93,80,0.35);
    display: block;
  }

  /* --- window body --- */
  .window-body{
    background: var(--white);
    border: 2px solid var(--teal);
    border-radius: 0 0 16px 16px;
    padding: 22px 22px 18px;
    box-shadow: 0 14px 30px -18px rgba(74, 63, 53, 0.4);
  }

  .intro{
    text-align: center;
    margin: 0 0 16px;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    color: var(--teal);
    margin: 0 0 4px;
  }

  .subtitle{
    font-style: italic;
    font-size: 0.9rem;
    color: var(--teal-soft);
    margin: 0;
  }

  /* --- grouped panels (soft fieldset look) --- */
  fieldset{
    border: 2px solid var(--mint-deep);
    border-radius: 14px;
    margin: 0 0 16px;
    padding: 18px 16px 16px;
    position: relative;
  }

  legend{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--teal);
    background: var(--peach);
    padding: 3px 12px;
    border-radius: 999px;
    margin-left: 4px;
  }

  /* --- LCD-style counter, softened --- */
  .lcd-panel{
    background: var(--cream);
    border-radius: 12px;
    box-shadow: inset 0 2px 6px rgba(74,63,53,0.15);
    padding: 16px 10px;
    text-align: center;
  }

  .lcd-number{
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 2.6rem;
    color: var(--teal);
    letter-spacing: 2px;
    line-height: 1;
  }

  .lcd-caption{
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    color: var(--teal-soft);
    margin-top: 6px;
  }

  .due-note{
    text-align: center;
    font-size: 0.85rem;
    margin: 12px 0 0;
    color: var(--teal-soft);
  }

  .due-note strong{ color: var(--teal); }

  /* --- week tracker --- */
  .week-readout{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.35rem;
    color: var(--brown);
    margin: 0 0 12px;
    text-align: center;
  }

  .progress-track{
    width: 100%;
    height: 18px;
    background: var(--mint);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
    gap: 2px;
    padding: 2px;
  }

  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--peach-deep));
    border-radius: 999px;
    transition: width 0.6s ease;
  }

  .progress-caption{
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--teal-soft);
    margin-top: 8px;
  }

  .trimester-line{
    text-align: center;
    font-size: 0.85rem;
    margin: 12px 0 0;
  }

  .trimester-badge{
    font-size: 0.78rem;
    background: var(--mint);
    color: var(--teal);
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 600;
  }

  /* --- size check --- */
  .size-row{
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .size-emoji{
    font-size: 2.6rem;
    line-height: 1;
    background: var(--cream);
    border-radius: 12px;
    padding: 10px 14px;
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: no-preference){
    .size-emoji{ animation: sway 3.4s ease-in-out infinite; display: inline-block; transform-origin: 50% 85%; }
  }
  @keyframes sway{ 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  .size-text p{ margin: 2px 0; font-size: 0.9rem; color: var(--teal-soft); }
  .size-text .size-name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--brown);
  }

  footer{
    text-align: center;
    font-size: 0.8rem;
    color: var(--teal-soft);
    margin-top: 16px;
    line-height: 1.6;
  }

  footer .signoff{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    color: var(--teal);
    font-size: 0.9rem;
  }

  @media (max-width: 420px){
    .lcd-number{ font-size: 2.1rem; }
    .window-body{ padding: 18px 16px 14px; }
    .size-row{ flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="win">

  <div class="title-bar">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.7-9.8-9.2C.6 8.2 2.4 4.8 5.7 4.2c2-.4 3.9.5 5 2.1 1.1-1.6 3-2.5 5-2.1 3.3.6 5.1 4 3.5 7.6C19.5 16.3 12 21 12 21z" fill="#2F5D50"/></svg>
    <span class="title-bar-text">baby_countdown</span>
    <div class="title-bar-dots"><span></span><span></span><span></span></div>
  </div>

  <div class="window-body">

    <div class="intro">
      <h1>Little One's Countdown</h1>
      <p class="subtitle">status: still cooking</p>
    </div>

    <fieldset>
      <legend>due date countdown</legend>
      <div class="lcd-panel">
        <div class="lcd-number" id="daysToGo">----</div>
        <div class="lcd-caption" id="countdownLabel">DAYS UNTIL ARRIVAL</div>
      </div>
      <p class="due-note">Due date: <strong>March 19, 2027</strong></p>
    </fieldset>

    <fieldset>
      <legend>current progress</legend>
      <p class="week-readout" id="weekReadout">Week -- &middot; Day --</p>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="progress-caption">
        <span>Week 0</span>
        <span>Week 40</span>
      </div>
      <p class="trimester-line"><span class="trimester-badge" id="trimesterBadge">Trimester --</span></p>
    </fieldset>

    <fieldset>
      <legend>size check</legend>
      <div class="size-row">
        <div class="size-emoji" id="sizeEmoji">&#127819;</div>
        <div class="size-text">
          <p>about the size of a:</p>
          <p class="size-name" id="sizeName">lemon</p>
          <p id="sizeNote">Working hard on eyebrows and a strong opinion about naps.</p>
        </div>
      </div>
    </fieldset>

  </div>
</div>

<script>
  // Anchor point: September 19, 2026 is the first day of week 14.
  const anchorDate = new Date(2026, 8, 19);
  anchorDate.setHours(0,0,0,0);
  const anchorWeek = 14;

  const dueDate = new Date(2027, 2, 19);
  dueDate.setHours(0,0,0,0);

  const today = new Date();
  today.setHours(0,0,0,0);

  const MS_PER_DAY = 86400000;
  function daysBetween(a, b) { return Math.round((b - a) / MS_PER_DAY); }

  // --- Countdown to due date ---
  const daysToGo = daysBetween(today, dueDate);
  const daysToGoEl = document.getElementById('daysToGo');
  const labelEl = document.getElementById('countdownLabel');

  if (daysToGo > 0) {
    daysToGoEl.textContent = daysToGo;
    labelEl.textContent = 'DAYS UNTIL ARRIVAL';
  } else if (daysToGo === 0) {
    daysToGoEl.textContent = '0';
    labelEl.textContent = 'TODAY IS THE DAY';
  } else {
    daysToGoEl.textContent = Math.abs(daysToGo);
    labelEl.textContent = 'DAYS SINCE ARRIVAL';
  }

  // --- Week tracker ---
  const daysSinceAnchor = daysBetween(anchorDate, today);
  const gestDaysAtAnchor = (anchorWeek - 1) * 7;
  const totalGestDays = gestDaysAtAnchor + daysSinceAnchor;

  const currentWeek = Math.max(1, Math.floor(totalGestDays / 7) + 1);
  const currentDayInWeek = ((totalGestDays % 7) + 7) % 7 + 1;

  document.getElementById('weekReadout').textContent =
    'Week ' + currentWeek + ' \u00B7 Day ' + currentDayInWeek;

  const progressPct = Math.min(100, Math.max(0, (currentWeek / 40) * 100));
  document.getElementById('progressFill').style.width = progressPct + '%';

  let trimester = 1;
  if (currentWeek > 27) trimester = 3;
  else if (currentWeek > 13) trimester = 2;
  document.getElementById('trimesterBadge').textContent = 'Trimester ' + trimester;

  // --- Size comparison ---
  const sizes = {
    4:  ['\uD83C\uDF31', 'poppy seed', 'Barely there, already causing chaos.'],
    5:  ['\uD83C\uDF3E', 'sesame seed', 'Officially a "someone" now.'],
    6:  ['\uD83E\uDED8', 'lentil', 'Heart just started its lifelong job.'],
    7:  ['\uD83E\uDED0', 'blueberry', 'Tiny limbs are starting to bud.'],
    8:  ['\uD83C\uDF47', 'raspberry', 'Basically all head and ambition.'],
    9:  ['\uD83C\uDF47', 'grape', 'Fingers and toes forming, future foot-in-mouth expert.'],
    10: ['\uD83C\uDF4A', 'kumquat', 'Vital organs clocking in for their first shift.'],
    11: ['\uD83C\uDF30', 'fig', 'Kicking practice begins, mostly unfelt.'],
    12: ['\uD83C\uDF4B', 'lime', 'Reflexes online. Fists: also online.'],
    13: ['\uD83E\uDED8', 'pea pod', 'Fingerprints forming, a whole tiny identity.'],
    14: ['\uD83C\uDF4B', 'lemon', 'Working hard on eyebrows and a strong opinion about naps.'],
    15: ['\uD83C\uDF4E', 'apple', 'Can sense light. Judging the room already.'],
    16: ['\uD83E\uDD51', 'avocado', 'Might be able to make a fist. Solidarity.'],
    17: ['\uD83E\uDD54', 'turnip', 'Practicing swallowing, hiccups included.'],
    18: ['\uD83E\uDED1', 'bell pepper', 'Ears in position, the eavesdropping begins.'],
    19: ['\uD83C\uDF45', 'heirloom tomato', 'Growing a protective waxy coating, like a tiny raincoat.'],
    20: ['\uD83C\uDF4C', 'banana', 'Halfway there. Time to double the snacks.'],
    21: ['\uD83E\uDD55', 'carrot', 'Movements getting stronger and much more noticeable.'],
    22: ['\uD83C\uDF5D', 'spaghetti squash', 'Eyebrows and eyelids fully formed.'],
    23: ['\uD83E\uDD6D', 'large mango', 'Hearing improving, start curating the playlist.'],
    24: ['\uD83C\uDF3D', 'corn cob', 'Face is basically fully formed. Hello in there.'],
    25: ['\uD83E\uDD54', 'rutabaga', 'Getting a little chubbier by the week.'],
    26: ['\uD83E\uDDC5', 'bunch of scallions', 'Eyes opening for the first time.'],
    27: ['\uD83E\uDD66', 'cauliflower', 'Officially closing out the second trimester.'],
    28: ['\uD83C\uDF46', 'eggplant', 'Can blink now. Judging the room, confirmed.'],
    29: ['\uD83C\uDF83', 'butternut squash', 'Muscles and lungs getting stronger daily.'],
    30: ['\uD83E\uDD6C', 'cabbage', 'Brain developing at a rapid pace.'],
    31: ['\uD83E\uDD65', 'coconut', 'Kicks strong enough to be a whole event.'],
    32: ['\uD83C\uDF4D', 'jicama', 'Practicing breathing, dress rehearsal underway.'],
    33: ['\uD83C\uDF4D', 'pineapple', 'Bones hardening, skull staying flexible on purpose.'],
    34: ['\uD83C\uDF48', 'cantaloupe', 'Fingernails fully grown in.'],
    35: ['\uD83C\uDF48', 'honeydew melon', 'Kidneys fully developed, taking on liver duties too.'],
    36: ['\uD83E\uDD57', 'head of romaine', 'Settling into position, hopefully head-down.'],
    37: ['\uD83E\uDD6C', 'bunch of chard', 'Considered early term as of this week.'],
    38: ['\uD83E\uDD52', 'leek', 'Losing that fine baby hair, gaining grip strength.'],
    39: ['\uD83C\uDF49', 'mini watermelon', 'Fully baked and just topping off reserves.'],
    40: ['\uD83C\uDF83', 'small pumpkin', 'Due date week, any day now.'],
    41: ['\uD83C\uDF49', 'large watermelon', 'Fashionably late, taking their sweet time.'],
    42: ['\uD83C\uDF49', 'extra-large watermelon', 'Very over the eviction notice by now.']
  };

  const clampedWeek = Math.min(42, Math.max(4, currentWeek));
  const sizeInfo = sizes[clampedWeek];
  document.getElementById('sizeEmoji').textContent = sizeInfo[0];
  document.getElementById('sizeName').textContent = sizeInfo[1];
  document.getElementById('sizeNote').textContent = sizeInfo[2];
</script>

</body>
</html>
